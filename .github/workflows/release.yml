name: release

# Builds Reef for Windows and macOS, then publishes the platform packages before the
# launcher. macOS binaries cannot be cross-compiled on Windows because the build resolves
# darwin native packages during bundling.
#
# Requires the repository secret NPM_TOKEN with publish rights to reefcode and reefcode-*.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the build
        required: true
        default: 0.1.0
      publish:
        description: Publish to npm
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: code
      - name: Build
        working-directory: code/packages/cli
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_TARGET: ${{ matrix.target }}
        run: bun run build --single --skip-web-ui
      - name: Pack
        working-directory: code/packages/cli
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run pack
      - name: Publish platform package
        if: ${{ inputs.publish }}
        working-directory: code/dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./reefcode-${{ matrix.target }}-${{ inputs.version }}.tgz --access public

  launcher:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: code
      - name: Pack launcher
        working-directory: code/packages/cli
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run pack
      - name: Publish launcher
        working-directory: code/dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./reefcode-${{ inputs.version }}.tgz --access public
